# Checks every push to main and every pull request: types, lint, unit + axe tests, that the
# generated docs are current, a production build, and the full browser accessibility audit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as Netlify (netlify.toml)
          cache: npm

      - name: Install
        run: npm ci

      # LayoutProps and the route types come from .next/types, which a fresh checkout doesn't have.
      - name: Type-check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and accessibility tests
        run: npm test

      - name: Docs are up to date
        run: |
          npm run docs
          if ! git diff --quiet -- docs ':!docs/a11y-report.md'; then
            echo "::error::docs/ is out of date. Run npm run docs and commit the result."
            git diff --stat -- docs
            exit 1
          fi

      - name: Build
        run: npm run build

      # Both checks drive the Google Chrome that GitHub's Ubuntu runners already have.
      - name: Hydration check and accessibility audit
        run: |
          npm start -- --port 3000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          # Every page must hydrate even with the comment Netlify injects into <head>.
          set -o pipefail
          npm run check:hydration 2>&1 | tee checks.log
          npm run a11y 2>&1 | tee -a checks.log

      - name: Audit report in the run summary
        if: always()
        run: |
          # On failure, put the reason first: failing pages, timeouts and errors from the checks.
          if [ -f checks.log ] && grep -qE "✗|failed|Error" checks.log; then
            { echo "## Why the checks failed"; echo '```'; grep -E "✗|failed|Error|waiting for|Timeout" checks.log | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f docs/a11y-report.md ]; then cat docs/a11y-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: docs/a11y-report.md
          if-no-files-found: ignore
